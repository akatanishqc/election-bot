services:
  - type: web
    name: election-bot-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_MODE
        value: ACTIVE
    autoDeploy: true

  - type: cron
    name: polling-mode-scheduler
    runtime: python
    schedule: "0 * * * *"
    startCommand: python scripts/check_polling_schedule.py
